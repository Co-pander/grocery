<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>お買い物リスト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon/icon-192.png">
<link rel="apple-touch-icon" href="icon/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="買い物リスト">
<style>
/* =========================================================
   1. トークン
   ========================================================= */
:root{
  --bg:#faf8f4;              /* 生成りの紙色 */
  --card:#ffffff;
  --line:#eae5db;
  --text:#54504a;
  --muted:#aca69a;
  --faint:#cdc6b8;           /* 空のチェックボックスの線 */
  --accent:#e5876a;          /* アイコンのコーラル */
  --accent-light:#f3ab8c;
  --accent-soft:#fbeee8;
  --grad:linear-gradient(135deg,#f3ab8c 0%,#e0745a 100%);
  --lift:0 4px 14px rgba(120,110,100,.25);   /* 掴んでいる行の浮き */
}

/* =========================================================
   2. 土台
   ========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* hidden属性は display を持つクラス（.btns など）に負けるので明示的に勝たせる */
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
/* 指で操作する行は、文字選択・長押しメニュー・ダブルタップ拡大を止める */
.tab,.row,.erow,.cathead,.pickrow,.grip,.sec-label,.chip,.fchip{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.row,.erow,.cathead,.pickrow{touch-action:manipulation;}  /* ダブルタップ拡大と遅延クリックを止める */
/* 並べ替え中／シートを開いている間は、下地をスクロールさせない */
body.dragging,body.dragging .sheet{overflow:hidden;}
/* iOS では body の overflow:hidden だけでは背後のスクロールが止まらないので、
   位置を固定して逃がさない（top は開いたときのスクロール量をJSで入れる） */
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden;}

/* 掴んでいる要素の共通の見え方 */
.drag-active{
  border-radius:8px;box-shadow:var(--lift);
  outline:1.5px solid var(--accent-light);z-index:5;background:var(--bg);
}

/* =========================================================
   3. ヘッダー
   ========================================================= */
header{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 14px 0;
  border-bottom:1px solid var(--line);
}
.hd-row{display:flex;align-items:center;gap:8px;}
.hd-title{font-size:16px;font-weight:700;flex:1;letter-spacing:.06em;}
.hd-btn{
  background:none;border:1px solid var(--line);color:var(--muted);
  font-size:11.5px;padding:6px 12px;border-radius:999px;font-weight:700;
  font-family:inherit;
}
.hd-btn:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-light);}
.tabs{display:flex;margin-top:10px;}
.tab{
  flex:1;text-align:center;padding:10px 0 9px;font-size:13.5px;font-weight:700;
  color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;
  margin-bottom:-1px;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* =========================================================
   4. リスト（TODOリスト風に罫線だけで並べる）
   ========================================================= */
main{padding:10px 12px 96px;max-width:640px;margin:0 auto;}
.group{background:none;}
.group.filtered .grip{visibility:hidden;}   /* 絞り込み中は並べ替え不可 */

.row{
  display:flex;align-items:center;gap:8px;
  padding:4px 4px;border-bottom:1px solid var(--line);
  background:var(--bg);position:relative;
}
.group > .row:last-child{border-bottom:0;}
.row .name{
  flex:1;min-width:0;font-size:14px;color:var(--muted);line-height:1.35;padding:3px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row.planned .name{color:var(--text);font-weight:600;}
.row.bought .name{text-decoration:line-through;color:var(--muted);}

/* アイテム名より主張しないよう、細めで少し小さく */
.tag{
  font-size:11.5px;padding:3px 9px;border-radius:999px;
  font-weight:500;flex:none;max-width:42%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 登録リストのアイテムは文字が薄いので、タグの濃さもそれに合わせる */
.row:not(.planned) .tag{opacity:.45;}

.grip{color:var(--faint);font-size:12px;flex:none;letter-spacing:-1px;}
.row-x{
  background:none;border:0;color:var(--faint);font-size:13px;
  flex:none;padding:4px 2px 4px 6px;font-family:inherit;line-height:1;
}
.row-x:active{color:#b9705c;}

/* アイコンに合わせた角丸の四角いチェックボックス */
.chk{
  width:21px;height:21px;border-radius:5px;flex:none;
  border:1.5px solid var(--faint);background:transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:transparent;padding:0;line-height:1;
}
.chk.on-plan{border-color:var(--faint);color:var(--accent);}  /* アイコンと同じ見た目 */
.chk.on-buy{border-color:transparent;background:var(--grad);color:#fff;}
.chk:disabled{opacity:.45;}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:48px 20px;line-height:1.9;}

/* =========================================================
   5. 見出し・タグ絞り込み
   ========================================================= */
.sec-head{display:flex;align-items:center;gap:8px;margin:14px 4px 5px;}
.sec-head:first-child{margin-top:2px;}
.sec-label{
  flex:1;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;
}
.filter-btn{
  background:none;border:0;font-size:11px;font-weight:700;
  color:var(--muted);padding:3px 6px;font-family:inherit;
}
.filter-btn.on{color:var(--accent);}
.fbar{
  display:flex;gap:6px;overflow-x:auto;
  padding:0 4px 7px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.fbar::-webkit-scrollbar{display:none;}
.fchip{
  font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  white-space:nowrap;flex:none;font-family:inherit;
}
.fchip.on{border-color:transparent;}
.fchip.all.on{background:var(--accent);color:#fff;}
.note{font-size:10.5px;color:var(--muted);margin:5px 4px 0;}

/* =========================================================
   6. カテゴリ（登録リストのまとまり）
   ========================================================= */
/* 開閉できるまとまり（カテゴリと履歴で共用） */
.fold{margin-bottom:2px;}
.cathead{
  display:flex;align-items:center;gap:7px;
  padding:6px 4px;border-bottom:1px solid var(--line);
}
.cathead .caret{color:var(--muted);font-size:9px;width:11px;flex:none;}
.cathead .cname{
  flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cathead .ccount{font-size:11px;color:var(--muted);flex:none;}
.fold > .group{padding-left:15px;}
.group.loose{margin-top:10px;}

/* =========================================================
   7. 履歴（月 → 日付 → アイテムの3段）
   ========================================================= */
#histTools{margin:2px 0 8px;}
#histQ{
  width:100%;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--text);
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  -webkit-appearance:none;appearance:none;
}
#histQ::placeholder{color:var(--faint);}
#histQ:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.histbody{padding-left:10px;}
.cathead.sub .cname{font-size:12.5px;color:var(--muted);}   /* 月 */
.cathead.sub2 .cname{font-size:12px;font-weight:600;color:var(--muted);}  /* 日 */
.cathead.sub .caret,.cathead.sub2 .caret{font-size:8px;}

/* =========================================================
   8. ＋ボタン
   ========================================================= */
.fab{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:17px;border:0;
  background:var(--grad);color:#fff;font-size:28px;line-height:1;
  box-shadow:0 4px 14px rgba(200,120,90,.35);z-index:30;
}
.fab:active{transform:scale(.94);}

/* =========================================================
   9. シート（下から出るパネル）
   ========================================================= */
.mask{
  position:fixed;inset:0;background:rgba(90,86,78,.35);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
  overscroll-behavior:contain;
}
#tagMask,#catMask{z-index:50;}          /* アイテム画面の上に重ねる */
.mask.hidden{display:none;}
.sheet{
  background:var(--card);width:100%;max-width:640px;
  border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;animation:up .2s ease;
  /* 端まで来てもスクロールを背後のリストへ渡さない */
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:15px;margin:0 0 14px;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;letter-spacing:.06em;}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin:12px 2px 0;}

input[type=text]{
  width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);
  border-radius:10px;background:#fbfaf8;font-family:inherit;color:var(--text);
}
input[type=text]::placeholder{color:var(--faint);}
input[type=text]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}

.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.chip{
  font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid transparent;
  font-weight:700;cursor:pointer;
}
/* 選択枠は濃いグレーだとタグの色まで暗く見えるので、アクセント色にする */
.chip.sel{border-color:var(--accent);}
.chip.cat{background:#f2efe9;color:var(--muted);}
.chip.cat.sel{background:var(--accent-soft);color:#b5644a;}
.chip.edit{background:none;border:1.5px dashed var(--faint);color:var(--muted);font-family:inherit;}

.btns{display:flex;gap:9px;margin-top:6px;}
.btn{
  flex:1;padding:12px;border-radius:11px;border:0;font-size:14.5px;font-weight:700;
  font-family:inherit;
}
.btn.primary{background:var(--grad);color:#fff;}
.btn.ghost{background:#f2efe9;color:var(--muted);}
.btn.danger{background:var(--accent-soft);color:#c0664a;}
.btn:active{opacity:.75;}
#catBtnsPick .btn{font-size:13px;padding:12px 4px;}

/* =========================================================
   10. タグ／カテゴリの編集行（共通）
   ========================================================= */
/* タグ・カテゴリとも、アイテムリストに近い行間でそろえる */
.erow{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:2px 2px;background:var(--card);
}
.erow > .grip{                       /* 行全体が掴めるので位置の目印だけ */
  width:22px;min-height:34px;display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
/* 名前は通常テキスト表示。ダブルタップで入力欄に変わる
   （常時入力欄だと行の長押しがフォーカスに取られてドラッグできない） */
.ename{
  flex:1;min-width:0;padding:6px 10px;font-size:15px;line-height:1.5;
  border-radius:8px;background:#fbfaf8;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ename.ph{color:var(--faint);}
/* 入力中は枠に収めきらず、文字の下が切れないようにする */
.ename input[type=text]{
  display:block;width:100%;padding:0;border:0;background:none;
  font-size:15px;line-height:1.6;height:auto;border-radius:0;
}
.icon-btn{background:none;border:0;color:var(--faint);font-size:15px;padding:4px 6px;}
.catcount{
  background:none;border:0;font-size:11.5px;font-weight:700;color:var(--muted);
  font-family:inherit;padding:8px 4px;flex:none;white-space:nowrap;
}

/* 色見本（タップで下にカラーピッカーが開く） */
.swatch{width:28px;height:28px;padding:0;border:0;border-radius:8px;flex:none;position:relative;}
.erow.open .swatch::after{
  content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:4px solid transparent;border-bottom-color:var(--faint);
}
.picker{flex-basis:100%;display:none;padding:10px 4px 14px 36px;}
.erow.open .picker{display:block;}
.sl{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.sl:last-child{margin-bottom:0;}
.sl > span{font-size:10px;color:var(--muted);width:32px;flex:none;font-weight:700;}
.picker input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;
  height:12px;border-radius:6px;border:0;margin:0;padding:0;
}
.picker input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:1px solid #d8d4cc;box-shadow:0 1px 3px rgba(90,86,78,.35);
}
.picker input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:#fff;border:1px solid #d8d4cc;box-shadow:0 1px 3px rgba(90,86,78,.35);
}

/* =========================================================
   11. カテゴリのアイテム選択
   ========================================================= */
/* スクロールバーとチェックが重ならないよう、右に余白を取る */
.picklist{
  max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:10px;
  overscroll-behavior:contain;
}
.pickrow{
  display:flex;align-items:center;gap:9px;padding:9px 2px;
  border-bottom:1px solid var(--line);
}
.pickrow:last-child{border-bottom:0;}
.pickrow .pname{
  flex:1;min-width:0;font-size:14px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pickrow .owner{
  font-size:10.5px;font-weight:700;flex:none;max-width:40%;
  padding:2px 8px;border-radius:999px;background:#f2efe9;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pickrow .owner.mine{background:var(--accent-soft);color:#b5644a;}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <div class="hd-title">お買い物リスト</div>
    <button class="hd-btn" id="btnTags">タグ</button>
    <button class="hd-btn" id="btnCats">カテゴリ</button>
    <button class="hd-btn" id="btnReset">リセット</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="list">リスト</div>
    <div class="tab" data-tab="hist">履歴</div>
  </div>
</header>

<main>
  <div id="viewList"></div>
  <div id="histTools" hidden>
    <input type="search" id="histQ" placeholder="アイテム名で検索" autocomplete="off">
  </div>
  <div id="viewHist" hidden></div>
</main>

<button class="fab" id="fab">＋</button>

<!-- アイテムの登録／編集 -->
<div class="mask hidden" id="itemMask">
  <div class="sheet">
    <h2 id="itemTitle">アイテムを登録</h2>
    <div class="fld">
      <label>アイテム名</label>
      <input type="text" id="itemName" placeholder="例：トイレットペーパー" autocomplete="off">
    </div>
    <div class="fld">
      <label>タグ</label>
      <div class="chips" id="itemTags"></div>
    </div>
    <div class="fld">
      <label>カテゴリ</label>
      <div class="chips" id="itemCats"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="itemCancel">キャンセル</button>
      <button class="btn primary" id="itemSave">保存</button>
    </div>
    <div class="btns" id="itemDelWrap" hidden>
      <button class="btn danger" id="itemDel">このアイテムを削除</button>
    </div>
  </div>
</div>

<!-- タグの編集 -->
<div class="mask hidden" id="tagMask">
  <div class="sheet">
    <h2>タグの編集</h2>
    <div id="tagList"></div>
    <div class="btns">
      <button class="btn ghost" id="tagAdd">＋ タグを追加</button>
      <button class="btn primary" id="tagClose">完了</button>
    </div>
    <p class="hint">名前は<b>ダブルタップ</b>で編集、色は左の四角をタップ。<br>
      行を<b>長押ししてドラッグ</b>すると並べ替えできます。<br>
      名前が空のタグは閉じるときに削除されます。</p>
  </div>
</div>

<!-- カテゴリの編集（一覧 ⇔ アイテム選択の2階層） -->
<div class="mask hidden" id="catMask">
  <div class="sheet">
    <h2 id="catTitle">カテゴリの編集</h2>
    <div id="catList"></div>
    <div class="btns" id="catBtnsList">
      <button class="btn ghost" id="catAdd">＋ カテゴリを追加</button>
      <button class="btn primary" id="catClose">完了</button>
    </div>
    <div class="btns" id="catBtnsPick" hidden>
      <button class="btn ghost" id="catBack">← 戻る</button>
      <button class="btn ghost" id="catRemove">外す</button>
      <button class="btn primary" id="catAddItems">追加</button>
    </div>
    <p class="hint" id="catHint"></p>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   1. データ
   ---------------------------------------------------------
   item : {id, name, tagId, catId, plannedOrder, bought}
          plannedOrder = null なら登録リスト、数値なら買う予定（昇順）
   hist : {id, itemId, date, order, name, tagName, tagColor}
          買った時点の写しを持つので、あとでリストを編集しても履歴は変わらない
   ========================================================= */
const KEY = 'grocery.v1';

const DEFAULTS = () => ({
  tags:[
    {id:'t1', name:'日用品', color:'#d7dde5'},
    {id:'t2', name:'肉',     color:'#f2c5b6'},
    {id:'t3', name:'魚',     color:'#c9dce4'},
    {id:'t4', name:'野菜',   color:'#d0dabc'},
    {id:'t5', name:'その他', color:'#e4ded1'}
  ],
  categories:[],
  items:[],
  history:[]
});

let db = load();

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || !s.items) return DEFAULTS();
  // 古い版のデータを今の形にそろえる
  s.categories = s.categories || [];
  s.history    = s.history || [];
  s.items.forEach(i => { if(i.catId === undefined) i.catId = null; });
  return s;
}
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const tagOf = id => db.tags.find(t => t.id === id) || null;
const catOf = id => db.categories.find(c => c.id === id) || null;

/* 「買う予定かどうか」の判定はここだけ。持ち方を変えてもここを直せば済む */
const isPlanned = i => i.plannedOrder != null;
const isRest    = i => !isPlanned(i);

const plannedItems = () => db.items.filter(isPlanned).sort((a,b) => a.plannedOrder - b.plannedOrder);
const restItems    = () => db.items.filter(isRest);

function todayKey(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
}

/* 履歴は購入時の写し。写しを持たない古い記録はタグIDから補う */
const histTag = h => h.tagName ? {name:h.tagName, color:h.tagColor} : tagOf(h.tagId);

/* =========================================================
   2. 小道具
   ========================================================= */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
const $ = id => document.getElementById(id);

const hexRGB = hex => {
  const c = (hex || '#cccccc').replace('#','');
  const n = c.length === 3 ? c.split('').map(x => x+x).join('') : c;
  return [0,2,4].map(i => parseInt(n.slice(i,i+2), 16));
};
/* 背景色に対して読みやすい文字色 */
function readable(hex){
  const [r,g,b] = hexRGB(hex);
  return (r*299 + g*587 + b*114)/1000 > 168 ? '#5b564e' : '#ffffff';
}

const isOpen = m => !m.classList.contains('hidden');

/* シートを開いている間は背後のリストを固定する。
   これが無いと、シートの端まで来たスクロールが背後へ流れてしまう。
   位置を固定するとページ先頭に戻ってしまうので、スクロール量を覚えて元に戻す。 */
let lockedY = 0;
function lockPage(){
  if(document.body.classList.contains('locked')) return;
  lockedY = window.scrollY;
  document.body.style.top = -lockedY + 'px';
  document.body.classList.add('locked');
}
function unlockPage(){
  if(!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked');
  document.body.style.top = '';
  window.scrollTo(0, lockedY);
}
function openSheet(m){
  m.classList.remove('hidden');
  lockPage();
}
function closeSheet(m){
  m.classList.add('hidden');
  if(!document.querySelector('.mask:not(.hidden)')) unlockPage();
}

/* 背景（シートの外側）を指でなぞっても何も動かないようにする */
document.querySelectorAll('.mask').forEach(m => {
  m.addEventListener('touchmove', e => {
    if(!e.target.closest('.sheet')) e.preventDefault();
  }, {passive:false});
});

const onHistTab = () => $('viewHist').hidden === false;
const refresh   = () => onHistTab() ? renderHist() : renderList();

/* =========================================================
   3. 並べ替え（長押しドラッグ）
   ---------------------------------------------------------
   sortable(commit) で作った箱の中だけで入れ替わる。
   確定処理は箱ごとに持たせるので、種類が増えても分岐が増えない。
   ========================================================= */
function sortable(commit, cls){
  const g = el('div', ('group ' + (cls || '')).trim().replace(/\s+/g, ' '));
  g._commit = commit;                       // (ids) => void
  return g;
}

let drag = null;
const blockEvent = e => { if(drag) e.preventDefault(); };

/* ドラッグを離した直後は click が続けて飛んでくる。
   そのまま通すとアイテムの編集画面が開いたりカテゴリが畳まれたりするので、
   1回だけ握りつぶす（クリックが来ないまま終わる場合に備えて時間でも解除）。 */
let swallowClick = false;
document.addEventListener('click', e => {
  if(!swallowClick) return;
  swallowClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* handle = 掴む場所、moving = 実際に動かす要素（省略時は handle 自身） */
function attachDrag(handle, moving){
  handle.addEventListener('pointerdown', e => {
    if(e.target.closest('button, input')) return;
    const timer = setTimeout(() => startDrag(moving || handle), 420);
    const stop = () => {
      clearTimeout(timer);
      handle.removeEventListener('pointerup', stop);
      handle.removeEventListener('pointercancel', stop);
      handle.removeEventListener('pointermove', watch);
    };
    // 指は静止していても数px揺れるので、判定はやや緩め
    const watch = ev => { if(Math.abs(ev.clientY - e.clientY) > 12) stop(); };
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
    handle.addEventListener('pointermove', watch);
  });
}

function startDrag(node){
  drag = {node, box:node.parentElement};
  node.classList.add('drag-active');
  document.body.classList.add('dragging');
  if(navigator.vibrate) navigator.vibrate(12);
  // スマホでは pointermove の preventDefault ではスクロールを止められない。
  // touchmove を非パッシブで拾わないと、指を動かした瞬間に画面が動いて中断される。
  document.addEventListener('pointermove', onDragMove, {passive:false});
  document.addEventListener('touchmove', blockEvent, {passive:false});
  document.addEventListener('contextmenu', blockEvent);
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}

function onDragMove(e){
  if(!drag) return;
  e.preventDefault();
  const y = e.clientY;
  for(const sib of [...drag.box.children]){
    if(sib === drag.node) continue;
    const r = sib.getBoundingClientRect(), mid = r.top + r.height/2;
    const after = sib.compareDocumentPosition(drag.node) & Node.DOCUMENT_POSITION_FOLLOWING;
    if(y < mid && after){ drag.box.insertBefore(drag.node, sib); break; }
    if(y > mid && !after){ drag.box.insertBefore(drag.node, sib.nextSibling); break; }
  }
}

function endDrag(){
  if(!drag) return;
  drag.node.classList.remove('drag-active');
  document.body.classList.remove('dragging');
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('touchmove', blockEvent);
  document.removeEventListener('contextmenu', blockEvent);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  const box = drag.box;
  drag = null;
  // 続けて飛んでくる click は指を離した直後に来る。
  // 長く構えると次の本当のタップまで飲み込んでしまうので、ごく短い間だけ。
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 150);
  box._commit([...box.children].map(c => c.dataset.id));
  save();
}

/* db.items 全体の中で、条件に合うものだけを ids の順に入れ替える */
function reorderItems(pred, ids){
  const sub = db.items.filter(pred).sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  let k = 0;
  db.items = db.items.map(i => pred(i) ? sub[k++] : i);
}
const sortByIds = (arr, ids) => arr.sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id));

/* =========================================================
   4. リストタブ
   ========================================================= */
const viewList = $('viewList');
const viewHist = $('viewHist');

/* セクションごとのタグ絞り込み状態（sel が空＝すべて表示） */
const ui = {
  planned:{sel:new Set(), open:false},
  rest:   {sel:new Set(), open:false}
};

function renderList(){
  viewList.innerHTML = '';
  if(!db.items.length){
    viewList.appendChild(el('div', 'empty')).innerHTML =
      '右下の ＋ からアイテムを登録します。<br>左の□で「買う予定」、右の□で「買った」。';
    return;
  }
  const planned = plannedItems(), rest = restItems();
  if(planned.length) section('planned', '買う予定', planned);
  if(rest.length)    section('rest',    '登録リスト', rest);
}

function section(kind, title, items){
  const f = tagFilter(kind, items);
  drawSectionHead(kind, title, items.length, f);

  if(!f.shown.length){
    viewList.appendChild(el('div', 'note', '該当するアイテムはありません。'));
    return;
  }
  if(kind === 'rest' && db.categories.length){
    drawCategories(f.shown, f.filtering);
  }else{
    const commit = kind === 'planned'
      ? ids => ids.forEach((id,n) => { const i = db.items.find(x => x.id === id); if(i) i.plannedOrder = n; })
      : ids => reorderItems(isRest, ids);
    viewList.appendChild(itemBox(f.shown, f.filtering, commit));
  }
  if(f.filtering) viewList.appendChild(el('div', 'note', '※ 絞り込み中は並べ替えできません'));
}

/* アイテムの行をまとめた並べ替え可能な箱 */
function itemBox(items, filtering, commit, cls){
  const box = sortable(ids => { commit(ids); renderList(); },
                       (cls || '') + (filtering ? ' filtered' : ''));
  items.forEach(i => box.appendChild(itemRow(i, !filtering)));
  return box;
}

/* 絞り込み状態を整えて、描画に必要なものを一式返す */
function tagFilter(kind, items){
  const sel = ui[kind].sel;
  const used = db.tags.filter(t => items.some(i => i.tagId === t.id));
  const noTag = items.some(i => !tagOf(i.tagId));
  // 中身が変わって選べなくなったタグは落とす
  [...sel].forEach(id => {
    if(id === '__none' ? !noTag : !used.some(t => t.id === id)) sel.delete(id);
  });
  return {
    sel, used, noTag,
    shown: sel.size ? items.filter(i => sel.has(tagOf(i.tagId) ? i.tagId : '__none')) : items,
    filtering: sel.size > 0
  };
}

function drawSectionHead(kind, title, total, f){
  const head = el('div', 'sec-head');
  head.appendChild(el('div', 'sec-label',
    title + '（' + f.shown.length + (f.filtering ? ' / ' + total : '') + '）'));

  const hasChoice = f.used.length + (f.noTag ? 1 : 0) > 1;
  const barOpen = ui[kind].open || f.filtering;
  if(hasChoice){
    const b = el('button', 'filter-btn' + (f.filtering ? ' on' : ''),
      (barOpen ? '▲' : '▼') + ' 絞り込み');
    b.onclick = () => { ui[kind].open = !ui[kind].open; renderList(); };
    head.appendChild(b);
  }
  viewList.appendChild(head);
  if(!hasChoice || !barOpen) return;

  const bar = el('div', 'fbar');
  const all = el('button', 'fchip all' + (f.filtering ? '' : ' on'), 'すべて');
  all.onclick = () => { f.sel.clear(); renderList(); };
  bar.appendChild(all);

  const chip = (id, name, color) => {
    const on = f.sel.has(id);
    const c = el('button', 'fchip' + (on ? ' on' : ''), name);
    if(on){ c.style.background = color; c.style.color = readable(color); }
    c.onclick = () => { on ? f.sel.delete(id) : f.sel.add(id); renderList(); };
    bar.appendChild(c);
  };
  f.used.forEach(t => chip(t.id, t.name, t.color));
  if(f.noTag) chip('__none', 'タグなし', '#d6d2ca');
  viewList.appendChild(bar);
}

/* 登録リストをカテゴリのまとまりで描く（買う予定・履歴はカテゴリを使わない） */
function drawCategories(shown, filtering){
  const wrap = sortable(ids => { sortByIds(db.categories, ids); renderList(); },
                        filtering ? 'filtered' : '');

  db.categories.forEach(cat => {
    const mine = shown.filter(i => i.catId === cat.id);
    if(filtering && !mine.length) return;      // 絞り込み中は空のカテゴリを出さない
    const open = filtering || cat.open !== false;   // 結果が隠れないよう絞り込み中は必ず開く

    const block = el('div', 'fold');
    block.dataset.id = cat.id;

    const head = foldHead({
      label: cat.name || '（無名）', count: mine.length, open,
      onToggle: () => {
        if(filtering) return;
        cat.open = !(cat.open !== false);
        save(); renderList();
      }
    });
    block.appendChild(head);

    if(open && mine.length){
      block.appendChild(itemBox(mine, filtering,
        ids => reorderItems(i => isRest(i) && i.catId === cat.id, ids)));
    }
    if(!filtering) attachDrag(head, block);     // 見出しを長押しでカテゴリごと移動
    wrap.appendChild(block);
  });
  viewList.appendChild(wrap);

  // どのカテゴリにも入れていないアイテム
  const loose = shown.filter(i => !catOf(i.catId));
  if(!loose.length) return;
  viewList.appendChild(itemBox(loose, filtering,
    ids => reorderItems(i => isRest(i) && !catOf(i.catId), ids), 'loose'));
}

function tagChip(t){
  const c = el('span', 'tag', t.name || '（無名）');
  c.style.background = t.color;
  c.style.color = readable(t.color);
  return c;
}

function itemRow(item, draggable){
  const planned = isPlanned(item);
  const row = el('div', 'row' + (planned ? ' planned' : '') + (item.bought ? ' bought' : ''));
  row.dataset.id = item.id;
  row.appendChild(el('span', 'grip', '⋮⋮'));

  const name = el('div', 'name', item.name);
  name.onclick = () => openItem(item);
  row.appendChild(name);

  const t = tagOf(item.tagId);
  if(t) row.appendChild(tagChip(t));

  const plan = el('button', 'chk' + (planned ? ' on-plan' : ''), '✓');   // 左：買う予定
  plan.onclick = () => togglePlan(item);
  row.appendChild(plan);

  const buy = el('button', 'chk' + (item.bought ? ' on-buy' : ''), '✓');  // 右：買った
  buy.disabled = !planned;
  buy.onclick = () => toggleBuy(item);
  row.appendChild(buy);

  if(draggable) attachDrag(row);
  return row;
}

/* =========================================================
   5. チェック操作
   ========================================================= */
function togglePlan(item){
  if(isPlanned(item)){
    item.plannedOrder = null;
    if(item.bought){ item.bought = false; dropHistory(item.id); }
  }else{
    // 新しくチェックしたものは「買う予定」の一番下に付く
    item.plannedOrder = Math.max(0, ...plannedItems().map(i => i.plannedOrder)) + 1;
  }
  save(); renderList();
}

function toggleBuy(item){
  if(!isPlanned(item)) return;
  item.bought = !item.bought;
  if(item.bought){
    const t = tagOf(item.tagId);
    db.history.push({
      id:uid(), itemId:item.id, date:todayKey(),
      order: plannedItems().concat(restItems()).findIndex(i => i.id === item.id),
      name: item.name,
      tagName: t ? t.name : null,
      tagColor: t ? t.color : null
    });
  }else{
    dropHistory(item.id);
  }
  save(); renderList();
}

function dropHistory(itemId){
  const d = todayKey();
  db.history = db.history.filter(h => !(h.itemId === itemId && h.date === d));
}

/* リセットで戻すのは「買った」ものだけ。
   買えなかったアイテムは次の機会にまた要るので「買う予定」に残す
   （不要になったら左のチェックを自分で外す）。 */
$('btnReset').onclick = () => {
  const bought = db.items.filter(i => i.bought);
  const left = plannedItems().filter(i => !i.bought).length;
  if(!bought.length){
    alert('「買った」チェックの付いたアイテムがありません。\n買う予定から外すときは、左の□のチェックを外してください。');
    return;
  }
  if(!confirm('買った ' + bought.length + ' 件を登録リストに戻します。\n' +
              (left ? '買っていない ' + left + ' 件は「買う予定」に残ります。\n' : '') +
              '（履歴は残ります）')) return;
  bought.forEach(i => { i.plannedOrder = null; i.bought = false; });
  save(); renderList();
};

/* =========================================================
   6. 履歴タブ
   ========================================================= */
/* 年 → 月 → 日 → アイテムの4段。
   開閉は覚えず、履歴タブを開くたび「今年だけ開いた」状態から始まる。 */
const histOpen = {years:new Set(), months:new Set(), dates:new Set()};

function resetHistFolds(){
  histOpen.years = new Set([String(new Date().getFullYear())]);
  histOpen.months.clear();
  histOpen.dates.clear();
  histQuery = '';
  const box = $('histQ');
  if(box) box.value = '';
}

const newestFirst = keys => [...keys].sort().reverse();
/* 入れ子のMapをたどって、末端の記録の数を数える */
const countIn = map =>
  [...map.values()].reduce((n, v) => n + (Array.isArray(v) ? v.length : countIn(v)), 0);

/* 検索中はすべて開いた状態で表示し、まとめての削除は伏せる（範囲が紛らわしいため） */
let histQuery = '';

function renderHist(){
  viewHist.innerHTML = '';
  if(!db.history.length){
    viewHist.appendChild(el('div', 'empty')).innerHTML =
      'まだ履歴がありません。<br>右の□にチェックを入れると記録されます。';
    return;
  }
  const q = histQuery.trim();
  const searching = q !== '';
  const found = searching
    ? db.history.filter(h => h.name.toLowerCase().includes(q.toLowerCase()))
    : db.history;

  if(searching){
    viewHist.appendChild(el('div', 'note',
      found.length ? '「' + q + '」に一致 ' + found.length + ' 件'
                   : '「' + q + '」に一致する履歴はありません。'));
    if(!found.length) return;
  }

  // 年 → 月 → 日 → 記録 を一度の走査でまとめる
  const years = new Map();
  found.forEach(h => {
    const y = h.date.slice(0, 4), m = h.date.slice(0, 7);
    if(!years.has(y)) years.set(y, new Map());
    const months = years.get(y);
    if(!months.has(m)) months.set(m, new Map());
    const days = months.get(m);
    if(!days.has(h.date)) days.set(h.date, []);
    days.get(h.date).push(h);
  });

  newestFirst(years.keys()).forEach(y => viewHist.appendChild(histYear(y, years.get(y), searching)));
  viewHist.appendChild(el('div', 'note',
    '※ タップでリスト詳細／長押しでアイテムを並べ替え（同じ日付の中）／✕ で削除'));
}

function histYear(year, months, searching){
  const open = searching || histOpen.years.has(year);
  const count = countIn(months);
  const block = el('div', 'fold');
  block.appendChild(foldHead({
    label: year + '年', count, open,
    onToggle: () => { toggleIn(histOpen.years, year); renderHist(); },
    onDelete: searching ? null
      : () => delHistRange(year + '年', count, h => h.date.slice(0, 4) === year, true)
  }));
  if(open){
    const body = el('div', 'histbody');
    newestFirst(months.keys())
      .forEach(m => body.appendChild(histMonth(m, months.get(m), searching)));
    block.appendChild(body);
  }
  return block;
}

function histMonth(ym, days, searching){
  const open = searching || histOpen.months.has(ym);
  const count = countIn(days);
  const label = Number(ym.slice(5, 7)) + '月';
  const block = el('div', 'fold');
  block.appendChild(foldHead({
    label, count, open, cls:'sub',
    onToggle: () => { toggleIn(histOpen.months, ym); renderHist(); },
    onDelete: searching ? null
      : () => delHistRange(Number(ym.slice(0,4)) + '年' + label, count,
                           h => h.date.slice(0, 7) === ym, false)
  }));
  if(open){
    const body = el('div', 'histbody');
    newestFirst(days.keys()).forEach(d => body.appendChild(histDate(d, days.get(d), searching)));
    block.appendChild(body);
  }
  return block;
}

const WEEKDAYS = ['日','月','火','水','木','金','土'];
/* 'YYYY-MM-DD' → 曜日。文字列から組み立てて時差でずれないようにする */
function weekdayOf(date){
  const [y, m, d] = date.split('-').map(Number);
  return WEEKDAYS[new Date(y, m - 1, d).getDay()];
}

function histDate(date, entries, searching){
  const open = searching || histOpen.dates.has(date);
  const wd = weekdayOf(date);
  const block = el('div', 'fold');
  block.appendChild(foldHead({
    label: Number(date.slice(8, 10)) + '日（' + wd + '）',
    count:entries.length, open, cls:'sub2',
    onToggle: () => { toggleIn(histOpen.dates, date); renderHist(); },
    onDelete: searching ? null
      : () => delHistRange(date.replace(/-/g, '／') + '（' + wd + '）',
                           entries.length, h => h.date === date, false)
  }));
  if(open){
    // 検索中は一部しか出ていないので並べ替えは止める
    const box = sortable(ids => {
      ids.forEach((id,n) => { const h = db.history.find(x => x.id === id); if(h) h.order = n; });
      renderHist();
    }, searching ? 'filtered' : '');
    entries.slice().sort((a,b) => a.order - b.order)
      .forEach(h => box.appendChild(histRow(h, !searching)));
    block.appendChild(box);
  }
  return block;
}

/* 開閉できる見出し（カテゴリと履歴で共用）。onDelete があれば右端に ✕ を出す */
function foldHead(o){
  const head = el('div', 'cathead' + (o.cls ? ' ' + o.cls : ''));
  head.appendChild(el('span', 'caret', o.open ? '▼' : '▶'));
  head.appendChild(el('span', 'cname', o.label));
  head.appendChild(el('span', 'ccount', o.count));
  if(o.onDelete){
    const x = el('button', 'row-x', '✕');
    x.onclick = e => { e.stopPropagation(); o.onDelete(); };   // 開閉と取り違えない
    head.appendChild(x);
  }
  head.onclick = o.onToggle;
  return head;
}
const toggleIn = (set, key) => set.has(key) ? set.delete(key) : set.add(key);

function histRow(h, draggable){
  const row = el('div', 'row');
  row.dataset.id = h.id;
  row.appendChild(el('span', 'grip', '⋮⋮'));

  const name = el('div', 'name', h.name);
  name.style.color = 'var(--text)';
  row.appendChild(name);

  const t = histTag(h);
  if(t) row.appendChild(tagChip(t));

  const x = el('button', 'row-x', '✕');
  x.onclick = () => delHistory(h);
  row.appendChild(x);

  if(draggable) attachDrag(row);
  return row;
}

function delHistory(h){
  if(!confirm('履歴から「' + h.name + '」を削除しますか？')) return;
  dropMatching(x => x.id === h.id);
}

/* 年・月・日をまとめて削除。年だけは件数が大きいので確認を2回出す */
function delHistRange(label, count, match, twice){
  const warn = db.history.some(h => match(h) && h.date === todayKey())
    ? '\n※ 本日分が含まれるため、リストの「買った」チェックも外れます。' : '';
  if(!confirm(label + 'の履歴 ' + count + ' 件をすべて削除しますか？\n' +
              'この操作は元に戻せません。' + warn)) return;
  if(twice && !confirm('本当に削除しますか？\n' + label + 'の ' + count + ' 件が消えます。')) return;
  dropMatching(match);
}

/* 条件に合う記録を消し、当日分ならリスト側の「買った」チェックも外して食い違いを防ぐ */
function dropMatching(match){
  const today = todayKey();
  db.history.filter(match).forEach(h => {
    if(h.date !== today) return;
    const it = db.items.find(i => i.id === h.itemId);
    if(it) it.bought = false;
  });
  db.history = db.history.filter(h => !match(h));
  save(); renderHist(); renderList();
}

/* =========================================================
   7. タブ切り替え
   ========================================================= */
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    const list = tab.dataset.tab === 'list';
    viewList.hidden = !list;
    viewHist.hidden = list;
    $('fab').hidden = !list;
    // 履歴は開くたび「今年だけ開いた」状態＋検索なしに戻す
    if(!list) resetHistFolds();
    $('histTools').hidden = list;
    refresh();
  };
});

/* =========================================================
   8. アイテムの登録／編集
   ========================================================= */
const itemMask = $('itemMask');
let editing = null, pickedTag = null, pickedCat = null;

$('fab').onclick = () => openItem(null);
$('itemCancel').onclick = () => closeSheet(itemMask);
itemMask.onclick = e => { if(e.target === itemMask) closeSheet(itemMask); };

function openItem(item){
  editing = item;
  pickedTag = item ? item.tagId : (db.tags[0] && db.tags[0].id);
  pickedCat = item ? item.catId : null;
  $('itemTitle').textContent = item ? 'アイテムを編集' : 'アイテムを登録';
  $('itemName').value = item ? item.name : '';
  $('itemDelWrap').hidden = !item;
  drawTagChips();
  drawCatChips();
  openSheet(itemMask);
  if(!item) setTimeout(() => $('itemName').focus(), 80);
}

function drawTagChips(){
  const box = $('itemTags');
  box.innerHTML = '';
  if(pickedTag && !tagOf(pickedTag)) pickedTag = db.tags[0] ? db.tags[0].id : null;
  db.tags.forEach(t => {
    const c = el('div', 'chip' + (t.id === pickedTag ? ' sel' : ''), t.name || '（無名）');
    c.style.background = t.color;
    c.style.color = readable(t.color);
    c.onclick = () => { pickedTag = t.id; drawTagChips(); };
    box.appendChild(c);
  });
  const e = el('button', 'chip edit', '＋ タグを編集');
  e.onclick = openTags;
  box.appendChild(e);
}

function drawCatChips(){
  const box = $('itemCats');
  box.innerHTML = '';
  if(pickedCat && !catOf(pickedCat)) pickedCat = null;
  const mk = (id, label) => {
    const c = el('div', 'chip cat' + (id === pickedCat ? ' sel' : ''), label);
    c.onclick = () => { pickedCat = id; drawCatChips(); };
    box.appendChild(c);
  };
  mk(null, 'なし');
  db.categories.forEach(c => mk(c.id, c.name || '（無名）'));
  const e = el('button', 'chip edit', '＋ カテゴリを編集');
  e.onclick = openCats;
  box.appendChild(e);
}

$('itemSave').onclick = () => {
  const name = $('itemName').value.trim();
  if(!name){ alert('アイテム名を入力してください。'); return; }
  if(editing){
    // 履歴は購入した時点の記録なので、ここでは書き換えない
    Object.assign(editing, {name, tagId:pickedTag, catId:pickedCat});
  }else{
    db.items.push({id:uid(), name, tagId:pickedTag, catId:pickedCat,
                   plannedOrder:null, bought:false});
  }
  save(); closeSheet(itemMask); renderList();
};

$('itemDel').onclick = () => {
  if(!confirm('「' + editing.name + '」を削除します。（履歴は残ります）')) return;
  db.items = db.items.filter(i => i.id !== editing.id);
  save(); closeSheet(itemMask); renderList();
};

/* =========================================================
   9. 編集行の名前セル（タグ・カテゴリ共通）
   ========================================================= */
function nameCell(obj, placeholder, done){
  const cell = el('div', 'ename' + (obj.name ? '' : ' ph'), obj.name || placeholder);
  let lastTap = 0;
  cell.onclick = () => {
    const now = Date.now();
    if(now - lastTap < 320) cell._edit();
    lastTap = now;
  };
  cell._edit = () => {
    const inp = el('input');
    inp.type = 'text'; inp.value = obj.name; inp.placeholder = placeholder;
    cell.textContent = '';
    cell.classList.remove('ph');
    cell.appendChild(inp);
    inp.focus(); inp.select();
    // 入力のたびに保存（別の場所をタップして閉じても消えないように）
    inp.oninput = () => { obj.name = inp.value; save(); };
    let closed = false;
    inp.onblur = () => {
      if(closed) return;
      closed = true;
      obj.name = inp.value.trim();
      save(); done();
    };
    inp.onkeydown = e => { if(e.key === 'Enter') inp.blur(); };
  };
  return cell;
}

/* 追加直後の行は、そのまま入力できるように編集状態で開く */
function editLast(box){
  const cells = box.querySelectorAll('.ename');
  const last = cells[cells.length - 1];
  if(last){ last.scrollIntoView({block:'nearest'}); last._edit(); }
}

/* 名前が空のまま閉じたものは捨て、参照が切れたIDを掃除する */
function dropEmpty(listName, refKey){
  db[listName] = db[listName].filter(x => x.name.trim() !== '');
  const alive = new Set(db[listName].map(x => x.id));
  db.items.forEach(i => { if(i[refKey] && !alive.has(i[refKey])) i[refKey] = null; });
}

/* =========================================================
   10. タグの編集
   ========================================================= */
const tagMask = $('tagMask');
$('btnTags').onclick = openTags;
function openTags(){ renderTagEditor(); openSheet(tagMask); }

$('tagClose').onclick = () => {
  dropEmpty('tags', 'tagId');
  save(); closeSheet(tagMask);
  if(isOpen(itemMask)) drawTagChips();
  refresh();
};

$('tagAdd').onclick = () => {
  db.tags.push({id:uid(), name:'', color:randomPastel()});
  save(); renderTagEditor(true);
};

const TAG_EDITOR = {
  boxId:'tagList', list:'tags', ref:'tagId', placeholder:'新しいタグ',
  delMessage: n => 'このタグを使っているアイテムが ' + n + ' 件あります。削除しますか？\n（アイテムのタグは未設定になります）',
  lead: (t, row) => {
    const swatch = el('button', 'swatch');
    swatch.style.background = t.color;
    swatch.onclick = () => row.classList.toggle('open');
    row._swatch = swatch;
    return swatch;
  },
  extra: (t, row) => colorPicker(t, row._swatch)
};
const renderTagEditor = withEdit => renderEditor(TAG_EDITOR, withEdit);

/* タグとカテゴリは作りが同じなので、違うところだけ設定で受け取る。
   行の並びは：⋮⋮ / lead / 名前 / trail / ✕ / extra */
function renderEditor(cfg, withEdit){
  const box = $(cfg.boxId);
  const again = () => renderEditor(cfg);
  box.innerHTML = '';
  const list = sortable(ids => { sortByIds(db[cfg.list], ids); again(); });

  db[cfg.list].forEach(obj => {
    const row = el('div', 'erow');
    row.dataset.id = obj.id;
    row.appendChild(el('span', 'grip', '⋮⋮'));
    if(cfg.lead)  row.appendChild(cfg.lead(obj, row));
    row.appendChild(nameCell(obj, cfg.placeholder, again));
    if(cfg.trail) row.appendChild(cfg.trail(obj, row));
    row.appendChild(deleteBtn(
      () => db.items.filter(i => i[cfg.ref] === obj.id).length,
      cfg.delMessage,
      () => {
        db.items.forEach(i => { if(i[cfg.ref] === obj.id) i[cfg.ref] = null; });
        db[cfg.list] = db[cfg.list].filter(x => x.id !== obj.id);
        again();
      }));
    if(cfg.extra) row.appendChild(cfg.extra(obj, row));
    attachDrag(row);
    list.appendChild(row);
  });
  box.appendChild(list);
  if(withEdit) editLast(box);
}

function deleteBtn(countFn, message, remove){
  const b = el('button', 'icon-btn', '✕');
  b.onclick = () => {
    const n = countFn();
    if(n && !confirm(message(n))) return;
    remove(); save();
  };
  return b;
}

/* =========================================================
   11. カラーピッカー（色あい・鮮やかさ・明るさ）
   ========================================================= */
function colorPicker(tag, swatch){
  const box = el('div', 'picker');
  const [h,s,l] = hexHSL(tag.color);
  const st = {h, s, l};

  const slider = (key, label, max) => {
    const wrap = el('div', 'sl');
    wrap.appendChild(el('span', null, label));
    const r = el('input');
    r.type = 'range'; r.min = 0; r.max = max; r.value = st[key];
    r.oninput = () => {
      st[key] = +r.value;
      tag.color = hslHex(st.h, st.s, st.l);
      swatch.style.background = tag.color;
      paint(); save();
    };
    wrap.appendChild(r);
    box.appendChild(wrap);
    return r;
  };
  const rh = slider('h', '色あい', 360);
  const rs = slider('s', '鮮やか', 100);
  const rl = slider('l', '明るさ', 100);

  function paint(){   // 帯そのものを「動かしたらこうなる色」で塗る
    const hues = [];
    for(let d = 0; d <= 360; d += 30) hues.push('hsl(' + d + ',' + st.s + '%,' + st.l + '%)');
    rh.style.background = 'linear-gradient(90deg,' + hues.join(',') + ')';
    rs.style.background = 'linear-gradient(90deg,hsl(' + st.h + ',0%,' + st.l + '%),hsl(' + st.h + ',100%,' + st.l + '%))';
    rl.style.background = 'linear-gradient(90deg,#000,hsl(' + st.h + ',' + st.s + '%,50%),#fff)';
  }
  paint();
  return box;
}

const randomPastel = () => hslHex(Math.floor(Math.random()*360), 45, 84);

function hexHSL(hex){
  const [r,g,b] = hexRGB(hex).map(v => v/255);
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if(d){
    if(mx === r)      h = 60 * (((g-b)/d) % 6);
    else if(mx === g) h = 60 * ((b-r)/d + 2);
    else              h = 60 * ((r-g)/d + 4);
  }
  if(h < 0) h += 360;
  const l = (mx + mn)/2;
  const s = d ? d/(1 - Math.abs(2*l - 1)) : 0;
  return [Math.round(h), Math.round(s*100), Math.round(l*100)];
}

function hslHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)))));
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2,'0')).join('');
}

/* =========================================================
   12. カテゴリの編集（一覧 ⇔ アイテム選択）
   ========================================================= */
const catMask = $('catMask');
let pickCat = null;                 // アイテム選択画面で開いているカテゴリid
const picked = new Set();           // 選択中のアイテムid

$('btnCats').onclick = openCats;
function openCats(){ renderCatEditor(); openSheet(catMask); }

$('catClose').onclick = () => {
  dropEmpty('categories', 'catId');
  save(); closeSheet(catMask);
  if(isOpen(itemMask)) drawCatChips();
  refresh();
};

$('catAdd').onclick = () => {
  db.categories.push({id:uid(), name:'', open:true});
  save(); renderCatEditor(true);
};

$('catBack').onclick = () => renderCatEditor();

/* ---- 第1階層：カテゴリの一覧 ---- */
const CAT_EDITOR = {
  boxId:'catList', list:'categories', ref:'catId', placeholder:'新しいカテゴリ',
  delMessage: n => 'このカテゴリに入っているアイテムが ' + n + ' 件あります。削除しますか？\n（アイテムは残り、カテゴリなしに戻ります）',
  trail: cat => {
    const b = el('button', 'catcount',
      db.items.filter(i => i.catId === cat.id).length + '件 ›');
    b.onclick = () => renderCatPicker(cat.id);
    return b;
  }
};

function renderCatEditor(withEdit){
  pickCat = null;
  picked.clear();
  $('catBtnsList').hidden = false;
  $('catBtnsPick').hidden = true;
  $('catTitle').textContent = 'カテゴリの編集';
  $('catHint').innerHTML =
    '名前は<b>ダブルタップ</b>で編集、行を<b>長押ししてドラッグ</b>で並べ替え。<br>' +
    '右の<b>「◯件 ›」</b>から、アイテムをまとめて追加・カテゴリから外せます。<br>' +
    '名前が空のカテゴリは閉じるときに削除されます。';
  renderEditor(CAT_EDITOR, withEdit);
}

/* ---- 第2階層：このカテゴリに入れるアイテムを選ぶ ---- */
function renderCatPicker(catId){
  pickCat = catId;
  picked.clear();
  $('catBtnsList').hidden = true;
  $('catBtnsPick').hidden = false;
  $('catTitle').textContent = '「' + catName(catId) + '」のアイテム';
  $('catHint').textContent =
    'アイテムを選んでから「追加」または「外す」を押します。他のカテゴリに入っているものを追加するときは確認が出ます。';
  drawPickList();
}

const catName = id => { const c = catOf(id); return c ? (c.name || '（無名）') : ''; };

function drawPickList(){
  const box = $('catList');
  box.innerHTML = '';
  if(!db.items.length){
    box.appendChild(el('div', 'empty', '登録されたアイテムがありません。'));
    return;
  }
  const list = el('div', 'picklist');
  db.items.forEach(it => {
    const row = el('div', 'pickrow');
    row.appendChild(el('div', 'pname', it.name));

    const owner = catOf(it.catId);
    if(owner){
      row.appendChild(el('span', 'owner' + (it.catId === pickCat ? ' mine' : ''),
        owner.name || '（無名）'));
    }
    // 描き直すとスクロール位置が先頭に戻ってしまうので、その場で見た目だけ切り替える
    const mark = el('button', 'chk' + (picked.has(it.id) ? ' on-buy' : ''), '✓');
    const toggle = () => {
      const on = picked.has(it.id);
      on ? picked.delete(it.id) : picked.add(it.id);
      mark.classList.toggle('on-buy', !on);
    };
    mark.onclick = e => { e.stopPropagation(); toggle(); };
    row.onclick = toggle;
    row.appendChild(mark);
    list.appendChild(row);
  });
  box.appendChild(list);
}

/* まとめて追加。他のカテゴリに入っているものは確認してから移す */
$('catAddItems').onclick = () => {
  if(!picked.size){ alert('アイテムを選んでください。'); return; }
  const sel = db.items.filter(i => picked.has(i.id));          // db.items の並び順のまま
  const taken = sel.filter(i => catOf(i.catId) && i.catId !== pickCat);

  sel.filter(i => !taken.includes(i)).forEach(i => { i.catId = pickCat; });

  const askOne = i => {
    if(confirm('「' + i.name + '」はすでに「' + catName(i.catId) + '」に登録済です。\n\n' +
               'OK：カテゴリを変更する\nキャンセル：そのまま')){
      i.catId = pickCat;
    }
  };
  if(taken.length === 1){
    askOne(taken[0]);
  }else if(taken.length > 1){
    if(confirm(taken.length + '件がすでに別のカテゴリに登録済です。編集しますか？\n\n' +
               'OK：上から順に1件ずつ確認する\nキャンセル：カテゴリはそのまま')){
      taken.forEach(askOne);
    }else{
      save(); renderCatEditor(); return;      // 元の画面に戻る
    }
  }
  afterPick();
};

/* まとめて外す。このカテゴリに入っているものだけが対象 */
$('catRemove').onclick = () => {
  if(!picked.size){ alert('アイテムを選んでください。'); return; }
  const mine = db.items.filter(i => picked.has(i.id) && i.catId === pickCat);
  if(!mine.length){ alert('このカテゴリに入っているアイテムが選ばれていません。'); return; }
  if(!confirm(mine.length + '件を「' + catName(pickCat) + '」から外します。\n（アイテム自体は残ります）')) return;
  mine.forEach(i => { i.catId = null; });
  afterPick();
};

function afterPick(){
  save();
  picked.clear();
  const top = document.querySelector('.picklist');   // 見ていた位置を保つ
  const y = top ? top.scrollTop : 0;
  drawPickList();
  const again = document.querySelector('.picklist');
  if(again) again.scrollTop = y;
  if(isOpen(itemMask)) drawCatChips();
}

/* =========================================================
   13. 起動
   ========================================================= */
$('histQ').oninput = e => { histQuery = e.target.value; renderHist(); };
resetHistFolds();
renderList();
